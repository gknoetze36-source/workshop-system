<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ title }}</title>

    <meta name="description" content="{{ title }} for Vanta Automations (Pty) Ltd">

    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #0b0b0b;
            color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.7;
        }

        main {
            width: min(900px, calc(100% - 32px));
            margin: 40px auto;
            padding: 32px;
            background: #151515;
            border: 1px solid #292929;
            border-radius: 12px;
        }

        h1,
        h2,
        h3,
        h4 {
            line-height: 1.3;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 32px;
        }

        h2 {
            margin-top: 36px;
        }

        h3 {
            margin-top: 28px;
        }

        a {
            color: inherit;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 10px;
            text-align: left;
            vertical-align: top;
        }

        ul,
        ol {
            padding-left: 24px;
        }

        code {
            overflow-wrap: anywhere;
        }

        @media (max-width: 600px) {
            main {
                width: calc(100% - 20px);
                margin: 10px auto;
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <main>
        {{ document_html|safe }}
    </main>
</body>
</html>
