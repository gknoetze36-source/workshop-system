<!DOCTYPE html>
<html>
<head>
    <title>Meta WhatsApp Signup</title>
</head>

<body>

<button onclick="launchWhatsAppSignup()">
    Connect WhatsApp
</button>

<div id="status"></div>

<input id="waba_id" placeholder="WABA ID" readonly>
<input id="phone_number_id" placeholder="Phone Number ID" readonly>

<script>
window.fbAsyncInit = function () {
    FB.init({
        appId: "1549270700101851",
        autoLogAppEvents: true,
        xfbml: true,
        version: "v23.0"
    });
};
</script>

<script async defer crossorigin="anonymous"
src="https://connect.facebook.net/en_US/sdk.js"></script>

<script>

// -------------------------------------------------
// STATE
// -------------------------------------------------
let state = {
    waba_id: null,
    phone_number_id: null,
    phone_number: null,   // NEW (some Meta flows return raw number)
    code: null,
    cancelled: false,
    committed: false
};

// -------------------------------------------------
// MESSAGE LISTENER
// -------------------------------------------------
window.addEventListener("message", function (event) {

    if (event.origin !== "https://www.facebook.com") return;

    let data;

    try {
        if (typeof event.data === "string" && event.data.trim().startsWith("{")) {
            data = JSON.parse(event.data);
        } else if (typeof event.data === "object") {
            data = event.data;
        } else {
            return;
        }
    } catch (e) {
        return;
    }

    if (!data || data.type !== "WA_EMBEDDED_SIGNUP") return;

    const payload = data.data || data;

    console.log("META PAYLOAD:", payload);

    // -------------------------------------------------
    // CANCEL
    // -------------------------------------------------
    if (payload.event === "CANCEL") {
        state.cancelled = true;
        console.warn("Signup cancelled");
        return;
    }

    // -------------------------------------------------
    // WABA ID
    // -------------------------------------------------
    if (payload.waba_id) {
        state.waba_id = payload.waba_id;
        document.getElementById("waba_id").value = payload.waba_id;
    }

    // -------------------------------------------------
    // PHONE NUMBER ID (PRIMARY)
    // -------------------------------------------------
    if (payload.phone_number_id) {
        state.phone_number_id = payload.phone_number_id;
        document.getElementById("phone_number_id").value = payload.phone_number_id;
    }

    // -------------------------------------------------
    // ALT PHONE FIELD (SOME META FLOWS USE THIS)
    // -------------------------------------------------
    if (payload.phone_number) {
        state.phone_number = payload.phone_number;
    }

    // -------------------------------------------------
    // CODE
    // -------------------------------------------------
    if (payload.code) {
        state.code = payload.code;
    }

    // -------------------------------------------------
    // UI
    // -------------------------------------------------
    document.getElementById("status").innerText =
        "WABA: " + (state.waba_id || "pending") +
        " | Phone ID: " + (state.phone_number_id || "pending") +
        " | Phone: " + (state.phone_number || "n/a");

    tryCommit();
});

// -------------------------------------------------
// COMMIT GUARD
// -------------------------------------------------
function tryCommit() {

    if (state.committed) return;
    if (state.cancelled) return;

    // REQUIRE WABA + PHONE ID (not just one)
    if (!state.waba_id || !state.phone_number_id) {
        return;
    }

    // code optional depending on Meta flow stage
    if (!state.code) {
        return;
    }

    state.committed = true;
    sendToFlask();
}

// -------------------------------------------------
// LAUNCH
// -------------------------------------------------
function launchWhatsAppSignup() {

    console.log("=== META SIGNUP STARTED ===");

    FB.login(function (response) {
        console.log("FB login trigger only:", response);
    }, {
        config_id: "1585425766261252",
        response_type: "code",
        override_default_response_type: true,
        extras: {
            version: "v4"
        }
    });
}

// -------------------------------------------------
// SEND TO BACKEND
// -------------------------------------------------
function sendToFlask() {

    const payload = {
        franchise_id: "{{ franchise.id }}",
        waba_id: state.waba_id,
        phone_number_id: state.phone_number_id,
        phone_number: state.phone_number,
        code: state.code
    };

    console.log("FINAL PAYLOAD:", payload);

    fetch("/meta/v4/callback", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(data => {

        console.log("FLASK RESPONSE:", data);

        if (data.success) {
            window.location =
                "/admin/franchises/{{ franchise.id }}/audit";
        } else {
            state.committed = false;
            console.error("Backend rejected payload:", data);
        }
    })
    .catch(err => {
        state.committed = false;
        console.error("Flask error:", err);
    });
}

</script>

</body>
</html>
