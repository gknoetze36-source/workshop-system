<!DOCTYPE html>
<html>
<head>
    <title>Meta WhatsApp Signup</title>
</head>

<body>

<button onclick="launchWhatsAppSignup()">
    Connect WhatsApp
</button>

<div id="status"></div>

<input id="waba_id" placeholder="WABA ID" readonly>
<input id="phone_number_id" placeholder="Phone Number ID" readonly>

<script>
window.fbAsyncInit = function () {
    FB.init({
        appId: "1549270700101851",
        autoLogAppEvents: true,
        xfbml: true,
        version: "v23.0"
    });
};
</script>

<script async defer crossorigin="anonymous"
src="https://connect.facebook.net/en_US/sdk.js"></script>

<script>

let currentWabaId = null;
let currentPhoneId = null;
let currentCode = null;

// -------------------------------------------------
// META EMBEDDED SIGNUP EVENT LISTENER (FIXED)
// -------------------------------------------------
window.addEventListener("message", function (event) {

    if (event.origin !== "https://www.facebook.com") return;

    let data;
    try {
        data = typeof event.data === "string"
            ? JSON.parse(event.data)
            : event.data;
    } catch (e) {
        console.error("Invalid Meta payload:", e);
        return;
    }

    if (!data || data.type !== "WA_EMBEDDED_SIGNUP") return;

    const payload = data.data || data;

    console.log("META PAYLOAD:", payload);

    // ❌ Ignore cancelled or incomplete flows
    if (payload.event === "CANCEL") {
        console.warn("Signup cancelled by user");
        return;
    }

    // -----------------------------
    // STORE VALUES SAFELY
    // -----------------------------
    if (payload.waba_id) {
        currentWabaId = payload.waba_id;
        document.getElementById("waba_id").value = payload.waba_id;
    }

    if (payload.phone_number_id) {
        currentPhoneId = payload.phone_number_id;
        document.getElementById("phone_number_id").value = payload.phone_number_id;
    }

    if (payload.code) {
        currentCode = payload.code;
    }

    document.getElementById("status").innerText =
        "WABA: " + (currentWabaId || "pending") +
        " | Phone: " + (currentPhoneId || "pending");

    // -------------------------------------------------
    // ONLY SEND WHEN EVERYTHING IS READY
    // -------------------------------------------------
    if (currentWabaId && currentPhoneId && currentCode) {
        sendToFlask();
    }
});


// -------------------------------------------------
// LAUNCH SIGNUP (FIXED - TRIGGER ONLY)
// -------------------------------------------------
function launchWhatsAppSignup() {
    console.log("=== META SIGNUP STARTED ===");

    FB.login(function (response) {
        console.log("FB login triggered (ignore data):", response);
    }, {
        config_id: "1585425766261252",
        response_type: "code",
        override_default_response_type: true,
        extras: {
            version: "v4"
        }
    });
}


// -------------------------------------------------
// FLASK CALLBACK (ONLY WHEN COMPLETE)
// -------------------------------------------------
function sendToFlask() {

    const payload = {
        franchise_id: "{{ franchise.id }}",
        code: currentCode,
        waba_id: currentWabaId,
        phone_number_id: currentPhoneId
    };

    console.log("SENDING COMPLETE PAYLOAD TO FLASK:", payload);

    fetch("/meta/v4/callback", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(data => {
        console.log("FLASK RESPONSE:", data);

        if (data.success) {
            window.location =
                "/admin/franchises/{{ franchise.id }}/audit";
        } else {
            console.error("Backend rejected payload:", data);
        }
    })
    .catch(err => {
        console.error("Flask error:", err);
    });
}

</script>

</body>
</html>
