# Dedicated Railway Cron service configuration.
# Use this as the custom config path for a SECOND Railway service.
# Do not apply it to the web service.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m jobs.scheduler"
cronSchedule = "*/5 * * * *"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
